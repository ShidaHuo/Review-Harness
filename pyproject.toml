[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "review-harness-mvp"
version = "0.10.0"
description = "Cross-runtime, auditable scientific review assessment and outline workflow"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "ShidaHuo" }]
requires-python = ">=3.12"
keywords = ["literature-review", "openalex", "deepseek-harness", "kiro", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ShidaHuo/Review-Harness"
Repository = "https://github.com/ShidaHuo/Review-Harness.git"
Issues = "https://github.com/ShidaHuo/Review-Harness/issues"

[project.scripts]
review-harness = "review_harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
